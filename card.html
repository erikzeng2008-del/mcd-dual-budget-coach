<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>麦门全息人设卡 · 麦门双预算军师</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:'Microsoft YaHei','PingFang SC',sans-serif;background:#FFF6E3;padding:24px 16px 40px}
.kicker{font-size:12.5px;font-weight:800;color:#8a6d3b;letter-spacing:2px;margin-bottom:14px;text-align:center}
.kicker b{color:#DA291C}
/* ===== 全息卡 ===== */
.holo-stage{perspective:1100px;width:340px;max-width:92vw}
.holo-card{position:relative;width:100%;aspect-ratio:5/7;transform-style:preserve-3d;
  transition:transform .18s ease-out;cursor:grab}
.holo-card:active{cursor:grabbing}
.hl{position:absolute;inset:0;border-radius:20px;overflow:hidden}
.hl-bg{transform:translateZ(-60px) scale(1.06);
  background:repeating-conic-gradient(from 200deg at 78% 30%,rgba(255,199,44,.10) 0deg 4deg,transparent 4deg 10deg),
    radial-gradient(circle at 78% 22%,rgba(255,199,44,.30),transparent 55%),
    linear-gradient(160deg,#6B0F0F 0%,#A31818 45%,#DA291C 100%)}
.hl-sub{transform:translateZ(28px);display:flex;align-items:flex-start;justify-content:center;padding-top:13%}
.hl-sub img{max-width:76%;max-height:42%;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))}
.hl-line{transform:translateZ(16px);mix-blend-mode:screen;opacity:.85;display:flex;align-items:flex-start;
  justify-content:center;padding-top:13%}
.hl-line img{max-width:76%;max-height:42%;object-fit:contain;
  filter:brightness(1.9) saturate(0) drop-shadow(0 0 6px #FFC72C) drop-shadow(0 0 16px #FF9A3C) blur(.6px)}
.hl-txt{transform:translateZ(48px);display:flex;flex-direction:column;justify-content:space-between;
  padding:22px 20px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.hl-mid{flex:1}
.hl-rarity{align-self:flex-start;font-size:12px;font-weight:900;letter-spacing:2px;padding:4px 12px;
  border-radius:999px;color:#1a1a1a;box-shadow:0 0 14px currentColor}
.hl-emoji{font-size:40px;line-height:1}
.hl-title{font-size:34px;font-weight:900;letter-spacing:2px;margin-top:4px}
.hl-line-txt{font-size:14px;color:#FFE3C9;margin-top:6px;line-height:1.5}
.hl-nums{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}
.hl-num{background:rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.22);border-radius:10px;padding:6px 11px}
.hl-num b{display:block;font-family:Consolas,monospace;font-size:16px;color:#FFC72C}
.hl-num i{font-style:normal;font-size:10.5px;color:rgba(255,255,255,.72)}
.hl-foot{font-size:10.5px;color:rgba(255,255,255,.62);margin-top:10px}
.hl-laser{transform:translateZ(56px);mix-blend-mode:color-dodge;opacity:0;transition:opacity .3s ease;
  pointer-events:none;background-size:260% 260%;
  background:linear-gradient(115deg,transparent 15%,rgba(255,0,170,.42) 35%,rgba(255,199,44,.42) 50%,rgba(0,229,255,.42) 65%,transparent 85%)}
.holo-card.hot .hl-laser{opacity:1}
.hl-edge{transform:translateZ(62px);border:3px solid #FFC72C;border-radius:20px;
  box-shadow:0 0 0 1px rgba(255,243,176,.9) inset,0 0 22px rgba(255,199,44,.55),0 18px 40px rgba(0,0,0,.45);pointer-events:none}
/* ===== 操作 ===== */
.acts{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.btn{font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer;padding:11px 18px;border-radius:10px;
  border:2px solid #1a1a1a;background:#fff;color:#1a1a1a;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.main{background:#DA291C;color:#fff}
.btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 #1a1a1a}
.hint{font-size:12px;color:#9a8557;margin-top:14px;text-align:center;line-height:1.7;max-width:420px}
.hint b{color:#DA291C}
.foot{margin-top:18px;font-size:11.5px;color:#b3a179;text-align:center;line-height:1.7}
.foot a{color:#DA291C;text-decoration:none;font-weight:700}
</style></head><body>

<script>
var Q = new URLSearchParams(location.search);
function g(k, d) { var v = Q.get(k); return (v === null || v === '') ? d : v; }
var D = {
  t: g('t','热量刺客'), e: g('e','🔥'), r: g('r','传说'), rc: g('rc','#FFC72C'),
  l: g('l','减肥是明天的事'),
  p: g('p','29.9'), m: g('m','45'),
  k: g('k','800'), kt: g('kt','800'),
  pr: g('pr','40.0'), na: g('na','1554')
};
document.title = '我是麦门' + D.t + '（' + D.r + '）· 麦门双预算军师';
document.getElementById('title').textContent = D.t;
document.getElementById('emoji').textContent = D.e;
document.getElementById('lineTxt').textContent = D.l;
var rb = document.getElementById('rarity');
rb.textContent = '✦ ' + D.r; rb.style.background = D.rc;
var noCap = (+D.kt) >= 900;
var cells = [
  ['¥' + D.p, '实付 / 预算 ¥' + D.m],
  [D.k, 'kcal' + (noCap ? '' : ' / 目标 ' + D.kt)],
  [(+D.pr).toFixed(0) + 'g', '蛋白质'],
  [D.na, '钠 mg / 日 2000']
];
document.getElementById('nums').innerHTML = cells.map(function(c){
  return '<div class="hl-num"><b>' + c[0] + '</b><i>' + c[1] + '</i></div>';
}).join('');
/* 视差 */
var stage = document.getElementById('stage'), card = document.getElementById('card'), laser = document.getElementById('laser');
function move(e){
  var r = stage.getBoundingClientRect();
  var cx = e.touches ? e.touches[0].clientX : e.clientX;
  var cy = e.touches ? e.touches[0].clientY : e.clientY;
  var px = (cx - r.left) / r.width - 0.5, py = (cy - r.top) / r.height - 0.5;
  card.style.transform = 'rotateY(' + (px*20).toFixed(2) + 'deg) rotateX(' + (-py*15).toFixed(2) + 'deg)';
  card.classList.add('hot');
  laser.style.backgroundPosition = ((px+0.5)*100).toFixed(1) + '% ' + ((py+0.5)*100).toFixed(1) + '%';
}
function leave(){ card.style.transform=''; card.classList.remove('hot'); }
stage.addEventListener('mousemove', move);
stage.addEventListener('touchmove', move, {passive:true});
stage.addEventListener('mouseleave', leave);
stage.addEventListener('touchend', leave);
/* 复制链接 */
document.getElementById('linkBtn').onclick = function(){
  var u = location.href;
  (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(ok, ok);
  function ok(){ document.getElementById('linkBtn').textContent = '✅ 链接已复制'; }
};
/* 保存为图片 */
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
document.getElementById('saveBtn').onclick = function(){
  var W=680,H=952,cv=document.createElement('canvas');cv.width=W;cv.height=H;
  var c=cv.getContext('2d');
  var g2=c.createLinearGradient(0,0,W*.6,H);
  g2.addColorStop(0,'#6B0F0F');g2.addColorStop(.45,'#A31818');g2.addColorStop(1,'#DA291C');
  c.fillStyle=g2;c.fillRect(0,0,W,H);
  c.save();c.globalAlpha=.10;c.fillStyle='#FFC72C';
  for(var a=0;a<360;a+=5){c.beginPath();c.moveTo(W*.78,H*.22);
    c.arc(W*.78,H*.22,H*1.1,a*Math.PI/180,(a+2.2)*Math.PI/180);c.closePath();c.fill();}
  c.restore();
  var rg=c.createRadialGradient(W*.78,H*.22,0,W*.78,H*.22,W*.55);
  rg.addColorStop(0,'rgba(255,199,44,.34)');rg.addColorStop(1,'rgba(255,199,44,0)');
  c.fillStyle=rg;c.fillRect(0,0,W,H);
  var im=document.getElementById('subImg');
  function finish(){
    var lg=c.createLinearGradient(0,0,W,H);
    lg.addColorStop(0,'rgba(255,255,255,0)');lg.addColorStop(.38,'rgba(255,0,170,.16)');
    lg.addColorStop(.5,'rgba(255,199,44,.20)');lg.addColorStop(.62,'rgba(0,229,255,.16)');
    lg.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=lg;c.fillRect(0,0,W,H);
    c.font="900 26px 'Microsoft YaHei'";
    var rw=c.measureText('✦ '+D.r).width+34;
    c.fillStyle=D.rc;rr(c,40,44,rw,44,22);c.fill();
    c.fillStyle='#1a1a1a';c.textAlign='left';c.fillText('✦ '+D.r,57,74);
    c.font="72px 'Microsoft YaHei'";c.fillText(D.e,40,585);
    c.font="900 62px 'Microsoft YaHei'";c.fillStyle='#fff';
    c.shadowColor='rgba(0,0,0,.45)';c.shadowBlur=14;c.shadowOffsetY=4;
    c.fillText(D.t,40,655);c.shadowBlur=0;c.shadowOffsetY=0;
    c.font="26px 'Microsoft YaHei'";c.fillStyle='#FFE3C9';c.fillText(D.l,40,700);
    cells.forEach(function(cc,idx){
      var col=idx%2,row=(idx/2)|0,x=40+col*(W/2-20),y=730+row*92;
      c.fillStyle='rgba(0,0,0,.36)';rr(c,x,y,W/2-60,82,14);c.fill();
      c.strokeStyle='rgba(255,255,255,.22)';c.lineWidth=1.5;rr(c,x,y,W/2-60,82,14);c.stroke();
      c.fillStyle='#FFC72C';c.font="900 34px Consolas,monospace";c.fillText(cc[0],x+18,y+40);
      c.fillStyle='rgba(255,255,255,.72)';c.font="19px 'Microsoft YaHei'";c.fillText(cc[1],x+18,y+66);
    });
    c.fillStyle='rgba(255,255,255,.62)';c.font="20px 'Microsoft YaHei'";
    c.fillText('麦门双预算军师 · 数据来自麦当劳 MCP 实测快照 2026-10-12',40,H-34);
    c.strokeStyle='#FFC72C';c.lineWidth=8;rr(c,4,4,W-8,H-8,24);c.stroke();
    cv.toBlob(function(b){
      var u=URL.createObjectURL(b),a=document.createElement('a');
      a.href=u;a.download='麦门人设卡-'+D.t+'-'+D.r+'.png';
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(u);},4000);
    },'image/png');
  }
  if(im.complete && im.naturalWidth) drawSub(); else { im.onload = drawSub; im.onerror = finish; }
  function drawSub(){
    var maxW=W*.74,maxH=H*.40,iw=im.naturalWidth,ih=im.naturalHeight;
    var r2=Math.min(maxW/iw,maxH/ih);iw*=r2;ih*=r2;
    c.save();c.shadowColor='rgba(0,0,0,.5)';c.shadowBlur=26;c.shadowOffsetY=12;
    c.drawImage(im,(W-iw)/2,H*.13,iw,ih);c.restore();
    c.save();c.globalCompositeOperation='lighter';c.globalAlpha=.5;c.filter='blur(9px)';
    c.drawImage(im,(W-iw)/2,H*.13,iw,ih);c.restore();
    finish();
  }
};
